# Render deployment for the Foundry status/web layer.
# The web interface is a shell over the substrate; the core package
# keeps zero runtime dependencies. Only the [web] extra is installed.
services:
  - type: web
    name: foundry
    runtime: python
    plan: free
    buildCommand: pip install -e ".[web,mcp]"
    startCommand: uvicorn foundry.web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: FOUNDRY_ALLOWED_EMAIL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_BASE_URL
        sync: false
      # Demo mode (RFC-003.3) — off by default; not hard-coded to true
      # so a production environment must opt in explicitly. See the
      # README's "Demo mode" section before enabling.
      - key: FOUNDRY_DEMO_DATA
        sync: false
      - key: FOUNDRY_DATA_PATH
        sync: false
      - key: FOUNDRY_MCP_REMOTE_TOKEN
        generateValue: true
      - key: FOUNDRY_MCP_PRINCIPAL
        sync: false
      - key: FOUNDRY_MCP_HOUSEHOLD_ID
        sync: false
      - key: FOUNDRY_MCP_CLIENT
        sync: false
      - key: FOUNDRY_WITNESS_MODEL
        sync: false
