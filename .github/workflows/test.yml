# CI for the Foundry substrate and product domains: install the
# package with the dev, web, and MCP extras and run the full pytest suite on
# every supported Python line. The core suite remains runnable in a
# zero-dependency environment (see pyproject.toml's dependencies = []).
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # dev + web + mcp so the composed Mission Control/remote MCP surface
        # is collected and tested rather than failing on an absent SDK.
        run: pip install -e ".[dev,web,mcp]"
      - name: Test
        run: python -m pytest tests -q
